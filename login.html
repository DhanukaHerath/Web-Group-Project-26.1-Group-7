<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Scriptorium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
< class="auth-page">
  <!-- same video as the landing page, blurred behind the glass card -->
  <video class="auth-video" autoplay muted loop playsinline aria-hidden="true">
    <source src="videos/scriptorium-background.mp4" type="video/mp4">
  </video>

  <section class="auth-card">
  <!-- LOGIN -->
      <form id="loginForm" novalidate>
        <h1 id="authTitle">Login</h1>
        <label>Email
          <input type="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </label>
        <label>Password
          <span class="pw-wrap">
            <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" aria-label="Show password" data-action="toggle-pw">&#128065;</button>
          </span>
        </label>
        <a href="#" class="forgot" data-action="forgot">Forgot Password?</a>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="auth-submit">Sign in</button>
        <p class="auth-switch">Don't have an account? <a href="#" data-switch="register">Register</a></p>
      </form>

    </section>

</body>
  


</html>
